[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A small, observable coding agent built from first principles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "pathspec>=1.1,<2",
    "prompt-toolkit>=3,<4",
    "psutil>=6.1,<8",
    "pydantic>=2.10,<3",
    "pytest>=8.3,<10",
    "rich>=13.9,<15",
    "typer>=0.15,<1",
]

[project.scripts]
coding-agent = "coding_agent.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-psutil>=7,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
addopts = "-q --cov=coding_agent --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["coding_agent"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
